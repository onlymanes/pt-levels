<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 量化支撑压力位</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --green:#26a69a; --red:#ef5350; --ink:#222; --muted:#888; --line:#e5e5e5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:#fafafa; }
  header { padding:28px 24px 8px; max-width:1080px; margin:0 auto; }
  header h1 { margin:0 0 6px; font-size:22px; }
  header p { margin:0; color:var(--muted); font-size:13px; }
  .tabs { max-width:1080px; margin:16px auto 0; padding:0 24px; display:flex; gap:8px; flex-wrap:wrap; }
  .tabs button { padding:8px 14px; font-size:14px; border:1px solid var(--line); border-radius:20px; background:#fff; color:var(--ink); cursor:pointer; }
  .tabs button.active { background:#222; color:#fff; border-color:#222; }
  .search { max-width:1080px; margin:16px auto 0; padding:0 24px; display:flex; gap:8px; }
  .search input { flex:1; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:8px; text-transform:uppercase; }
  .search button { padding:10px 22px; font-size:15px; border:0; border-radius:8px; background:#222; color:#fff; cursor:pointer; }
  .search button:disabled { opacity:.5; cursor:default; }
  #hint { max-width:1080px; margin:8px auto 0; padding:0 24px; color:var(--muted); font-size:12px; }
  #warn { display:none; max-width:1080px; margin:12px auto 0; padding:0 24px; }
  #warn div { border-radius:8px; padding:10px 14px; font-size:14px; }
  #warn.anomaly div { background:#fdecea; border:1px solid #f5a3a3; color:#a02020; }
  #warn.notice div { background:#fff7e6; border:1px solid #f0c36d; color:#8a5a00; }
  #meta { max-width:1080px; margin:12px auto 0; padding:0 24px; display:flex; gap:24px; font-size:14px; flex-wrap:wrap; }
  #meta b { font-size:17px; }
  .sup { color:var(--green); } .res { color:var(--red); }
  #chart { max-width:1080px; height:480px; margin:12px auto 0; padding:0 24px; }
  #chartInner { height:100%; border:1px solid var(--line); border-radius:8px; background:#fff; position:relative; }
  #legend { position:absolute; top:8px; left:8px; z-index:5; pointer-events:none;
    background:rgba(255,255,255,.88); border:1px solid var(--line); border-radius:6px;
    padding:6px 10px; font-size:11px; line-height:1.8; color:#555;
    display:grid; grid-template-columns:auto auto; gap:2px 14px; align-items:center; }
  #legend b { font-size:12px; }
  #legend div { white-space:nowrap; }
  #err { display:none; max-width:1080px; margin:12px auto 0; padding:0 24px; color:var(--red); font-size:14px; }
  #loading { display:none; max-width:1080px; margin:12px auto 0; padding:0 24px; color:var(--muted); font-size:14px; }
  footer { max-width:1080px; margin:24px auto 40px; padding:0 24px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>AI 量化支撑压力位</h1>
  <p>输入标的代码，查看 K 线图与 AI 量化支撑位 / 压力位。数据每日收盘后更新。</p>
</header>

<div id="tabs"></div>
<div class="search">
  <input id="ticker" placeholder="输入标的代码，如 AAPL" maxlength="12" autocomplete="off"
         spellcheck="false" list="tickerList">
  <datalist id="tickerList"></datalist>
  <button id="go">查询</button>
</div>
<div id="hint">覆盖标的加载中…</div>

<div id="warn"><div id="warnText"></div></div>
<div id="err"></div>
<div id="loading">正在加载，请稍候…</div>

<div id="meta" style="display:none">
  <span>标的 <b id="mTicker">–</b></span>
  <span>数据日期 <b id="mDate">–</b></span>
  <span>短期支撑位 <b class="sup" id="mSup">–</b></span>
  <span>短期压力位 <b class="res" id="mRes">–</b></span>
  <span>中期支撑位 <b class="sup" id="mMidSup">–</b></span>
  <span>中期压力位 <b class="res" id="mMidRes">–</b></span>
</div>

<div id="chart"><div id="chartInner"><div id="legend" style="display:none"></div></div></div>

<footer>仅供研究参考，不构成投资建议。日线数据每日收盘后更新。</footer>

<script src="lightweight-charts.standalone.production.js"></script>
<script>
const TICKER_RE = /^[A-Z0-9.\-=]{1,12}$/;
const $ = id => document.getElementById(id);
let chart = null, candleSeries = null, priceLines = [];
let COVERAGE = [], NAMES = {};
const dispName = t => NAMES[t] ? NAMES[t] + ' (' + t + ')' : t;
// 中文显示名兜底：tickers.json 随数据构建更新，未更新前用此处保证标签中文
const DEFAULT_NAMES = {
  "000001.SS": "上证指数",
  "000016": "上证50指数",
  "000300": "沪深300指数",
  "GC=F": "黄金连续",
  "CL=F": "原油连续",
};
// 默认标签（四行）：第一行指数贵金属，第二三四行个股
// （等名单加载完再渲染，以便显示中文名）
const DEFAULT_TICKERS = [
  ["SPY","QQQ","000001.SS","000016","000300","GC=F","CL=F","TLT"],
  ["CEG","VST","CCJ","BE","BWXT","URA","FCX","USAR","WMB","COIN","ADBE"],
  ["VICI","NFLX","AMT","HROW","BEAM","TEM","NVO","RKT","KTOS","NTR","DIS"],
  ["AAPL","MSFT","NVDA","TSLA","GOOGL","AMZN","META","SPCX","MCD","OXY"],
];

function ensureChart() {
  if (chart) return;
  chart = LightweightCharts.createChart($('chartInner'), {
    layout: { background: { color: '#fff' }, textColor: '#555' },
    grid: { vertLines: { color: '#f0f0f0' }, horzLines: { color: '#f0f0f0' } },
    timeScale: { borderColor: '#e5e5e5' },
    rightPriceScale: { borderColor: '#e5e5e5' },
  });
  candleSeries = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    borderVisible: false,
  });
}

function clearPriceLines() {
  priceLines.forEach(pl => { try { candleSeries.removePriceLine(pl); } catch (e) {} });
  priceLines = [];
}

async function load(raw, syncInput = true) {
  const ticker = (raw || '').trim().toUpperCase();
  if (!ticker) return;
  document.querySelectorAll('#tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.ticker === ticker));
  if (syncInput) $('ticker').value = ticker;
  $('err').style.display = 'none';
  // —— 验证：格式 + 覆盖名单 ——
  if (!TICKER_RE.test(ticker)) {
    $('err').textContent = '标的代码格式不正确（仅允许字母、数字、. 和 -，最多 12 位）。';
    $('err').style.display = 'block';
    return;
  }
  if (COVERAGE.length && !COVERAGE.includes(ticker)) {
    $('err').textContent = '暂未覆盖该标的（当前覆盖 ' + COVERAGE.length + ' 只，输入框可下拉查看）。';
    $('err').style.display = 'block';
    return;
  }
  $('warn').style.display = 'none';
  $('warn').className = '';
  $('meta').style.display = 'none';
  $('loading').style.display = 'block';
  $('go').disabled = true;
  try {
    const res = await fetch('data/' + encodeURIComponent(ticker) + '.json');
    if (!res.ok) throw new Error('数据暂不可用，请稍后重试。');
    const d = await res.json();

    ensureChart();
    clearPriceLines();
    candleSeries.setData(d.candles);
    // 短期（原 PT1/PT2 口径）：细虚线；标签移到图表左侧图例，右侧轴不再显示
    priceLines.push(candleSeries.createPriceLine({ price: d.support, color: '#26a69a', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: '短期支撑位' }));
    priceLines.push(candleSeries.createPriceLine({ price: d.resistance, color: '#ef5350', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: false, title: '短期压力位' }));
    // 中期（minT=55）：粗实线
    if (d.mid_support != null && d.mid_resistance != null) {
      priceLines.push(candleSeries.createPriceLine({ price: d.mid_support, color: '#26a69a', lineWidth: 4, lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: false, title: '中期支撑位' }));
      priceLines.push(candleSeries.createPriceLine({ price: d.mid_resistance, color: '#ef5350', lineWidth: 4, lineStyle: LightweightCharts.LineStyle.Solid, axisLabelVisible: false, title: '中期压力位' }));
    }
    chart.timeScale().fitContent();

    $('mTicker').textContent = dispName(d.ticker);
    $('mTicker').dataset.code = d.ticker;
    $('mDate').textContent = d.as_of;
    $('mSup').textContent = d.support.toFixed(2);
    $('mRes').textContent = d.resistance.toFixed(2);
    $('mMidSup').textContent = d.mid_support != null ? d.mid_support.toFixed(2) : '–';
    $('mMidRes').textContent = d.mid_resistance != null ? d.mid_resistance.toFixed(2) : '–';
    $('meta').style.display = 'flex';
    // 图表左侧图例：两行两列（细线=短期，粗线=中期）
    $('legend').innerHTML =
      '<div><span style="color:#ef5350">─</span> 短期压力位 <b>' + d.resistance.toFixed(2) + '</b></div>' +
      '<div><span style="color:#26a69a">─</span> 短期支撑位 <b>' + d.support.toFixed(2) + '</b></div>' +
      (d.mid_resistance != null ? '<div><span style="color:#ef5350">━</span> 中期压力位 <b>' + d.mid_resistance.toFixed(2) + '</b></div>' : '') +
      (d.mid_support != null ? '<div><span style="color:#26a69a">━</span> 中期支撑位 <b>' + d.mid_support.toFixed(2) + '</b></div>' : '');
    $('legend').style.display = 'grid';
    if (d.warning === 'anomaly' || d.warning === 'notice') {
      $('warnText').textContent = (d.warning === 'anomaly' ? '⚠ ' : '● ') + d.warning_text;
      $('warn').style.display = 'block';
      $('warn').className = d.warning;
    }
  } catch (e) {
    $('err').textContent = e.message || '请求失败，请稍后重试。';
    $('err').style.display = 'block';
  } finally {
    $('loading').style.display = 'none';
    $('go').disabled = false;
  }
}

// 默认标签（三行，等名单加载完再渲染，以便显示中文名）
function renderTabs() {
  const tabsEl = $('tabs');
  tabsEl.innerHTML = '';
  DEFAULT_TICKERS.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'tabs';
    row.forEach(t => {
      const b = document.createElement('button');
      b.textContent = NAMES[t] || DEFAULT_NAMES[t] || t;  // 标签只显示中文名，不带括号代码
      b.dataset.ticker = t;
      b.addEventListener('click', () => load(t));
      rowEl.appendChild(b);
    });
    tabsEl.appendChild(rowEl);
  });
  const cur = ($('mTicker').dataset.code || 'SPY');
  tabsEl.querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', b.dataset.ticker === cur));
}

// 覆盖名单：驱动输入框自动补全与校验
fetch('data/tickers.json')
  .then(r => r.json())
  .then(d => {
    COVERAGE = d.tickers || [];
    NAMES = d.names || {};
    const dl = $('tickerList');
    COVERAGE.forEach(t => {
      const o = document.createElement('option');
      o.value = t;
      if (NAMES[t]) o.label = NAMES[t];
      dl.appendChild(o);
    });
    $('hint').textContent = '当前覆盖 ' + COVERAGE.length + ' 只标的，数据每日收盘后更新。';
    renderTabs();
  })
  .catch(() => { $('hint').textContent = ''; renderTabs(); });

$('go').addEventListener('click', () => load($('ticker').value));
$('ticker').addEventListener('keydown', e => { if (e.key === 'Enter') load($('ticker').value); });
load('SPY', false);
</script>
</body>
</html>
